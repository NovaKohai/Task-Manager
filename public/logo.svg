<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logo-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#logo-grad-1)" opacity="0.08" />
  
  <!-- Outer Hexagonal Shell -->
  <path d="M32 6L54 19V45L32 58L10 45V19L32 6Z" stroke="url(#logo-grad-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />
  <path d="M32 6L54 19V45L32 58L10 45V19L32 6Z" stroke="url(#logo-grad-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" opacity="0.5" />
  
  <!-- TeamTask Interlocking 'T' and Checkmark -->
  <!-- Horizontal T-bar -->
  <path d="M20 22H44" stroke="url(#logo-grad-1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Vertical T-stem curving to the left -->
  <path d="M32 22V36C32 40 29 43 25 43C21 43 18 40 18 36" stroke="url(#logo-grad-2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Checkmark line intersecting the T-stem -->
  <path d="M30 38L35 43L46 26" stroke="url(#logo-grad-1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
